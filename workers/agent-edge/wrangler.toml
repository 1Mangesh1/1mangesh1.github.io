name = "agent-edge"
main = "index.js"
compatibility_date = "2026-09-01"

# Sits in front of GitHub Pages for every request on the apex domain. Set this
# route to "Fail open" in the dashboard so the site keeps serving if the Worker
# errors or the free plan's daily request limit is reached.
routes = [{ pattern = "mangeshbide.tech/*", zone_name = "mangeshbide.tech" }]

# Only meaningful on the route; on workers.dev there is no origin to pass through to.
workers_dev = false

[ai]
binding = "AI"
remote = true

# The chatbot worker (../../wrangler.toml), reached directly for A2A requests.
[[services]]
binding = "CHAT"
service = "portfolio-ai-proxy"
remote = true
